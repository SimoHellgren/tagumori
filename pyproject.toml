[project]
name = "tagumori"
version = "1.2.6"
description = "Arbitrarily nestable tags for files"
authors = [{name = "Simo Hellgrén"}]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.7",
    "prompt-toolkit>=3.0.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "coverage>=7.5.3",
    "mypy>=1.10.0",
    "lark>=1.1.9",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
tagumori = "tagumori.cli:main"

[tool.mypy]
files = ["tagumori", "tests"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tagumori.query.parser"
ignore_errors = true

[tool.coverage.run]
source = ["tagumori"]
omit = ["tagumori/query/parser.py"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
